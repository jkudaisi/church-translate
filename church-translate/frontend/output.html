<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Live Translation</title>
<script src="config.js"></script>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0b0f;
    color: #f2f2f2;
    margin: 0;
  }
  header { padding: 16px; text-align: center; border-bottom: 1px solid #262633; }
  #banner {
    display: none;
    margin: 12px 16px 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: #2a2416;
    color: #f3dd9a;
    font-size: 14px;
    text-align: center;
  }
  #lang-picker { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 16px; }
  .lang-btn {
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid #444;
    background: #1a1a22;
    color: #eee;
    font-size: 15px;
  }
  .lang-btn.active { background: #4f7cff; border-color: #4f7cff; }
  #caption-view {
    padding: 24px 16px;
    font-size: clamp(28px, 6vw, 48px);
    line-height: 1.35;
    min-height: 40vh;
    text-align: center;
  }
  #caption-view.waiting { color: #666; font-size: 18px; }
  #controls, #test-line { display: flex; justify-content: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
  #controls button, #test-line button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: #262633;
    color: #eee;
  }
  #test-line { display: none; align-items: center; }
  #test-line input {
    flex: 1 1 220px;
    max-width: 420px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #14141c;
    color: #eee;
    font-size: 16px;
  }
  #status { text-align: center; color: #888; font-size: 13px; padding-bottom: 16px; }
  .hint { width: 100%; text-align: center; color: #777; font-size: 12px; margin: 0; }
</style>
</head>
<body>

<header><strong>Live Translation</strong></header>
<div id="banner"></div>
<div id="lang-picker"></div>
<div id="controls" style="display:none;">
  <button id="toggle-audio" type="button">Audio: On</button>
</div>
<form id="test-line">
  <input id="test-text" name="text" autocomplete="off" placeholder="English line, for example: Good morning, church." />
  <button type="submit">Send test line</button>
  <p class="hint">This box is only on the laptop page. Phones just listen.</p>
</form>
<div id="status">Pick a language to begin</div>
<div id="caption-view" class="waiting">Waiting for the next line…</div>

<script>
const LANGUAGES = [
  { code: "es", label: "Español", hasAudio: true },
  { code: "fr", label: "Français", hasAudio: true },
  { code: "yo", label: "Yorùbá", hasAudio: false },
  { code: "ig", label: "Igbo", hasAudio: false },
];

const SUPABASE_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js";

const pickerEl = document.getElementById("lang-picker");
const captionEl = document.getElementById("caption-view");
const statusEl = document.getElementById("status");
const controlsEl = document.getElementById("controls");
const toggleAudioBtn = document.getElementById("toggle-audio");
const bannerEl = document.getElementById("banner");
const testForm = document.getElementById("test-line");
const testInput = document.getElementById("test-text");

const pageParams = new URLSearchParams(location.search);
const pageConfig = window.CHURCH_TRANSLATE_CONFIG || null;

let sb = null;
let currentChannel = null;
let currentSocket = null;
let currentLang = null;
let audioEnabled = true;
let audioCtx = null;
let playHead = 0;

LANGUAGES.forEach((lang) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "lang-btn";
  btn.dataset.code = lang.code;
  btn.textContent = lang.label;
  btn.addEventListener("click", () => { selectLanguage(lang); });
  pickerEl.appendChild(btn);
});

function transportOf(cfg) {
  const override = pageParams.get("transport");
  if (override === "local" || override === "supabase") return override;
  if (cfg && cfg.transport === "local") return "local";
  return "supabase";
}

function showStatus(text) {
  statusEl.textContent = text;
}

function setCaption(text) {
  captionEl.classList.remove("waiting");
  captionEl.textContent = text;
}

function clearCaption() {
  captionEl.classList.add("waiting");
  captionEl.textContent = "Waiting for the next line…";
}

function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!audioCtx) {
    audioCtx = new Ctx();
    playHead = audioCtx.currentTime;
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function decodeBase64(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function fallbackHtmlAudio(bytes, contentType) {
  const blob = new Blob([bytes], { type: contentType || "audio/mpeg" });
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.onended = () => URL.revokeObjectURL(url);
  audio.play().then(() => {
    statusEl.dataset.audio = "ok";
  }).catch((err) => {
    console.error("Audio element failed:", err);
    statusEl.dataset.audio = "error";
  });
}

// Schedules MP3 (live) or WAV (demo) chunks back to back.
async function playAudioChunk(payload) {
  if (!payload || !payload.audio_b64) return;
  ensureAudio();
  if (!audioCtx) {
    statusEl.dataset.audio = "error";
    return;
  }
  const bytes = decodeBase64(payload.audio_b64);
  const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
  try {
    const buffer = await audioCtx.decodeAudioData(copy);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    const startAt = Math.max(playHead, audioCtx.currentTime + 0.02);
    source.start(startAt);
    playHead = startAt + buffer.duration;
    statusEl.dataset.audio = "ok";
    statusEl.dataset.audioSeconds = String(buffer.duration);
  } catch (err) {
    console.error("Audio decode failed, trying the audio element:", err);
    fallbackHtmlAudio(bytes, payload.content_type);
  }
}

function handleMessage(msg, lang) {
  // Local sockets send {event, payload}. supabase-js broadcast callbacks
  // put the same fields on the message. Accept either shape.
  const payload = msg && (msg.payload || msg);
  if (!payload) return;
  if (typeof payload.text === "string" && payload.text && !payload.audio_b64) {
    setCaption(payload.text);
  }
  if (payload.audio_b64 && lang.hasAudio && audioEnabled) {
    playAudioChunk(payload);
  }
}

function closeCurrent() {
  if (currentSocket) {
    currentSocket.onclose = null;
    currentSocket.close();
    currentSocket = null;
  }
  if (currentChannel && sb) {
    sb.removeChannel(currentChannel);
    currentChannel = null;
  }
}

function selectLanguage(lang) {
  currentLang = lang;
  ensureAudio();
  [...pickerEl.children].forEach((button) => {
    button.classList.toggle("active", button.dataset.code === lang.code);
  });
  closeCurrent();
  clearCaption();
  delete statusEl.dataset.audio;
  delete statusEl.dataset.audioSeconds;
  playHead = audioCtx ? audioCtx.currentTime : 0;
  controlsEl.style.display = lang.hasAudio ? "flex" : "none";

  const cfg = pageConfig;
  const transport = transportOf(cfg);
  if (transport === "local") {
    connectLocal(lang);
    return;
  }
  connectSupabase(lang, cfg);
}

function connectLocal(lang) {
  if (location.protocol === "file:") {
    showStatus("Open http://127.0.0.1:8000/ so this page can hear the laptop.");
    return;
  }
  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket(`${wsProto}//${location.host}/ws/${lang.code}`);
  currentSocket = socket;
  showStatus(`Connecting — ${lang.label}`);
  socket.onopen = () => {
    if (currentSocket !== socket) return;
    showStatus(`Connected — ${lang.label}`);
  };
  socket.onmessage = (ev) => {
    if (currentSocket !== socket) return;
    handleMessage(JSON.parse(ev.data), lang);
  };
  socket.onerror = () => {
    if (currentSocket !== socket) return;
    showStatus("Connection to the laptop failed");
  };
  socket.onclose = () => {
    if (currentSocket !== socket) return;
    showStatus("Disconnected from the laptop");
  };
}

function loadSupabaseSdk() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = SUPABASE_CDN;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Supabase library failed to load. Check the network and reload."));
    document.head.appendChild(script);
  });
}

async function connectSupabase(lang, cfg) {
  if (!cfg || !cfg.supabaseUrl || !cfg.supabaseAnonKey || cfg.supabaseAnonKey.indexOf("YOUR-") === 0) {
    showStatus("Set the Supabase URL and anon key in config.js (the public key, not the service key).");
    return;
  }
  showStatus(`Connecting — ${lang.label}`);
  try {
    await loadSupabaseSdk();
  } catch (err) {
    showStatus(err.message || "Supabase library failed to load");
    return;
  }
  if (!sb) {
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  }
  // Public channel. The laptop posts without ?private=true, and the two must match.
  const channel = sb.channel(`church-translate:${lang.code}`, {
    config: { private: false },
  });
  currentChannel = channel;
  channel.on("broadcast", { event: "caption" }, (msg) => {
    if (currentLang !== lang) return;
    handleMessage(msg, lang);
  });
  if (lang.hasAudio) {
    channel.on("broadcast", { event: "audio" }, (msg) => {
      if (currentLang !== lang) return;
      handleMessage(msg, lang);
    });
  }
  channel.subscribe((status) => {
    if (currentChannel !== channel) return;
    if (status === "SUBSCRIBED") showStatus(`Connected — ${lang.label}`);
    else if (status === "CHANNEL_ERROR") showStatus("Could not join the channel. Check the anon key and that Realtime is enabled.");
    else if (status === "TIMED_OUT") showStatus("Channel join timed out.");
    else if (status === "CLOSED") showStatus("Channel closed");
  });
}

toggleAudioBtn.addEventListener("click", () => {
  ensureAudio();
  audioEnabled = !audioEnabled;
  toggleAudioBtn.textContent = audioEnabled ? "Audio: On" : "Audio: Off";
});

testForm.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = testInput.value.trim();
  if (!text) return;
  if (!currentLang) {
    showStatus("Pick a language, then send the test line.");
    return;
  }
  try {
    const res = await fetch("/ingest", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      showStatus("Test line was rejected");
      return;
    }
    testInput.value = "";
  } catch (err) {
    console.error(err);
    showStatus("Could not reach the laptop");
  }
});

function boot() {
  const cfg = pageConfig;
  if (!cfg) {
    showStatus("Missing config.js. Copy config.example.js to config.js, or open this page from the laptop at http://127.0.0.1:8000/.");
    return;
  }
  const transport = transportOf(cfg);
  if (transport === "local") {
    testForm.style.display = "flex";
  }
  if (cfg.translationMode === "mock" || transport === "local") {
    bannerEl.style.display = "block";
    bannerEl.textContent = cfg.translationMode === "mock"
      ? "Demo on this laptop. Captions are marked [es], [fr], [yo], and [ig], and Spanish/French play a short tone instead of a voice."
      : "Connected to this laptop. Phones use the hosted page.";
  }
}

boot();
</script>
</body>
</html>
